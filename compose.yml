services:
  archivebox-slack:
    build: .
    ports:
      - "127.0.0.1:${CONSOLE_PORT:-8001}:8001"
    volumes:
      - bridge_data:/data
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Optional: docker compose --profile archivebox up -d --build
  archivebox:
    profiles: [archivebox]
    image: archivebox/archivebox:dev
    ports:
      - "127.0.0.1:5797:5797"
    volumes:
      - archivebox_data:/data
    restart: unless-stopped

volumes:
  bridge_data:
  archivebox_data:
