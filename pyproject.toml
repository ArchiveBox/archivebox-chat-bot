[project]
name = "archivebox-chat-bot"
version = "0.1.0"
description = "ArchiveBox Bot and ArchiveBox AI Bot across Slack, Discord, Zulip, Telegram, WhatsApp, IRC, iMessage, and Messenger."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "slack-sdk>=3.35,<4",
    "aiohttp>=3.11,<4",
    "pydantic>=2.10,<3",
    "pillow>=11,<13",
    "pydle[sasl]>=1.1,<2",
    "qrcode[pil]>=8,<9",
    "resvg-py>=0.3,<1",
    "defusedxml>=0.7,<1",
    "discord-py>=2.6,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[project.scripts]
archivebox-chat-bot = "archivebox_chat_bot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/local"]
