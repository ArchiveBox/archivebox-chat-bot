[project]
name = "archivebox-slack"
version = "0.1.0"
description = "A quiet Slack and Zulip companion for ArchiveBox, with a friendly setup console."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "slack-sdk>=3.35,<4",
    "aiohttp>=3.11,<4",
    "pydantic>=2.10,<3",
    "pillow>=11,<13",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[project.scripts]
archivebox-slack = "archivebox_slack.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/local"]
